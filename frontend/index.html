<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smriti</title>
</head>
<body>
  <h1>Smriti</h1>
  <p>Ask a question about the indexed codebase.</p>
  <textarea id="question" rows="3" cols="70" placeholder="Ask about this codebase..."></textarea>
  <br>
  <button id="ask-button">Ask</button>
  <h2>Answer</h2>
  <pre id="answer"></pre>
  <h2>Sources</h2>
  <div id="citations"></div>

  <script src="/static/app.js"></script>
</body>
</html>
